name: Reusable Docker Build & Push

on:
  workflow_call:
    inputs:
      jvm-type:
        required: true
        type: string
        description: "'jre' or 'jdk'"
      docker-context:
        required: true
        type: string
        description: Docker Build Context

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/java-base
  # Ref in adoptium/containers to vendor the eclipse-temurin build steps from.
  # Pinned to 'main' so new Temurin patch releases are picked up by the daily
  # scheduled build without a manual version-bump commit in this repo.
  ADOPTIUM_CONTAINERS_REF: main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      -
        name: Generate Dockerfile from adoptium/containers
        id: generate-dockerfile
        run: |
          JAVA_MAJOR_VERSION="$(basename ${{ inputs.docker-context }})"
          scripts/generate-temurin-dockerfile.sh "${JAVA_MAJOR_VERSION}" "${{ inputs.jvm-type }}" "${{ inputs.docker-context }}"

          JAVA_VERSION_MATCHES="$(grep -c '^ENV JAVA_VERSION=jdk-' ${{ inputs.docker-context }}/Dockerfile)"
          if [ "${JAVA_VERSION_MATCHES}" -ne 1 ]; then
            echo "::error::Expected exactly one ENV JAVA_VERSION=jdk-... line in generated Dockerfile, found ${JAVA_VERSION_MATCHES}"
            exit 1
          fi

          JAVA_VERSION="$(sed -n 's/^ENV JAVA_VERSION=jdk-//p' ${{ inputs.docker-context }}/Dockerfile | tr '+' '_')"
          echo "java-version=${JAVA_VERSION}" >> "$GITHUB_OUTPUT"
      -
        name: Copy sample app to Docker context dir
        run: cp app/target/app.jar ${{ inputs.docker-context }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
        with:
          platforms: arm64
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=(\d+).*,group=1,priority=101,value=${{ steps.generate-dockerfile.outputs.java-version }}
            type=raw,priority=102,value=${{ steps.generate-dockerfile.outputs.java-version }}
          flavor: |
            latest=false
            suffix=-${{ inputs.jvm-type }}
      -
        name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          platforms: amd64,arm64
          context: ${{ inputs.docker-context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
